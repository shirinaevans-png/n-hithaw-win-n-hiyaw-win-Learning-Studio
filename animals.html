<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animal Flashcards | Cree Learning Studio</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#193e39;background:#f5f7f2}
*{box-sizing:border-box}
body{margin:0}
header{background:#173d38;color:white;padding:22px 5vw}
header a{color:#fff}
header h1{margin:8px 0 4px}
main{max-width:1180px;margin:auto;padding:20px 18px 60px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px}
select,input,button{padding:11px 13px;border:1px solid #a7c2af;border-radius:11px;font:inherit;color:#173d38;background:#fff}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #bd8c3b;outline-offset:3px}
#count{color:#5a7369;font-size:.9rem;margin:0 0 13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px}
.animal{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:235px;background:#fff;border:1px solid #d1e0d3;border-radius:17px;box-shadow:0 3px 12px #163a3210;padding:13px 10px;transition:transform .15s,box-shadow .15s;text-align:center}
.animal:hover{transform:translateY(-3px);box-shadow:0 8px 18px #163a3226}
.picture{height:175px;width:100%;display:grid;place-items:center}
.picture img{max-height:170px;max-width:100%;object-fit:contain}
.placeholder{display:grid;place-items:center;background:#edf3ee;border-radius:14px;width:100%;height:150px;color:#8ca99c;font-size:45px}
.name{font-weight:700;font-size:1rem;margin-top:10px;overflow-wrap:anywhere}
dialog{border:0;border-radius:22px;box-shadow:0 20px 70px #0c292668;background:#fff;color:#173d38;width:min(440px,calc(100% - 26px));padding:26px 24px 22px;text-align:center}
dialog::backdrop{background:#102c29a9}
.close{position:absolute;right:12px;top:11px;border:0;background:#eef4ef;font-size:22px;width:41px;height:41px;padding:0}
#modalArt{height:165px;display:grid;place-items:center}
#modalArt img{height:155px;max-width:90%;object-fit:contain}
#modalArt .placeholder{height:125px;width:155px;margin:auto}
#modalEnglish{font-size:1.1rem;margin:8px 0}
#modalWord{font-size:clamp(1.55rem,5vw,2.1rem);font-weight:750;margin:12px 0;overflow-wrap:anywhere}
#modalInfo{font-size:.88rem;color:#597a6b;margin-top:10px}
#modalAudio{margin:16px 0 0}
#modalAudio audio{width:100%;max-width:290px}
#source{display:inline-block;color:#21624e;font-size:.88rem;margin-top:14px}
@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.animal{min-height:185px;padding:9px}.picture{height:128px}.picture img{max-height:126px}.placeholder{height:120px}.controls>*{flex-grow:1}}
@media(prefers-reduced-motion:reduce){.animal{transition:none}}
</style>
</head>
<body>
<header><a href="index.html">← Learning Studio homepage</a><h1>Animal Flashcards</h1><div>nîhithawîwin (TH) · nêhiyawêwin (Y)</div></header>
<main>
<div class="controls">
<select id="dialect" aria-label="Dialect"><option value="plains_y">Plains Cree (Y)</option><option value="woodland_th">Woodland Cree (TH)</option></select>
<input type="search" id="filter" aria-label="Find an animal" placeholder="Find an animal">
<select id="show" aria-label="Filter animals"><option value="all">All animals</option><option value="verified">Cree words available</option><option value="illustrated">Illustrated animals</option></select>
<button id="shuffle" type="button">Shuffle</button>
</div>
<div id="count" aria-live="polite"></div>
<section class="grid" id="cards" aria-label="Animal cards"></section>
</main>
<dialog id="wordDialog" aria-labelledby="modalEnglish">
<button class="close" id="close" type="button" aria-label="Close">×</button>
<div id="modalArt"></div>
<div id="modalEnglish"></div>
<div id="modalWord"></div>
<div id="modalInfo"></div>
<div id="modalAudio"></div>
<a id="source" target="_blank" rel="noopener noreferrer" hidden>Dictionary source ↗</a>
</dialog>
<script src="animals-data.js"></script>
<script>
"use strict";
const dataset=Array.isArray(window.CREE_ANIMALS)?window.CREE_ANIMALS:[];
const $=s=>document.querySelector(s);
let animals=[...dataset];
let selectedAnimal=null;
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function artwork(a){return a.image?`<img src="${escapeHTML(a.image)}" alt="${escapeHTML(a.english)}" loading="lazy">`:'<span class="placeholder" aria-hidden="true">✧</span>'}
function currentDialect(){return $("#dialect").value}
function render(){
 const d=currentDialect(), query=$("#filter").value.trim().toLowerCase(), mode=$("#show").value;
 const visible=animals.filter(a=>(a.english+" "+(a[d]||"")).toLowerCase().includes(query)&&(mode!=="verified"||Boolean(a[d]))&&(mode!=="illustrated"||Boolean(a.image)));
 $("#count").textContent=`${visible.length} animal${visible.length===1?"":"s"}`;
 const grid=$("#cards");grid.replaceChildren();
 for (const a of visible){
   const b=document.createElement("button");b.type="button";b.className="animal";
   b.setAttribute("aria-label",a.english);
   b.innerHTML=`<span class="picture">${artwork(a)}</span><span class="name">${escapeHTML(a.english)}</span>`;
   b.addEventListener("click",()=>openAnimal(a));
   grid.appendChild(b);
 }
}
function openAnimal(a){
 selectedAnimal=a;updateDialog(a);$("#wordDialog").showModal();
}
function updateDialog(a){
 const d=currentDialect();
 $("#modalArt").innerHTML=artwork(a);
 $("#modalEnglish").textContent=a.english;
 $("#modalWord").textContent=a[d]||"Word not yet verified";
 $("#modalInfo").textContent=(d==="plains_y"?"Plains Cree (Y)":"Woodland Cree (TH)")+(a[d]?" · "+(a[d==="plains_y"?"status_y":"status_th"]||"Review pending"):"");
 const audio=a[d==="plains_y"?"audio_y":"audio_th"];
 const sound=$("#modalAudio");sound.replaceChildren();
 if(audio){const player=document.createElement("audio");player.controls=true;player.preload="none";player.src=audio;sound.appendChild(player)}
 const source=$("#source");const link=d==="plains_y"?a.plains_source:"";
 source.hidden=!link;if(link)source.href=link;else source.removeAttribute("href");
}
$("#close").addEventListener("click",()=>$("#wordDialog").close());
$("#wordDialog").addEventListener("click",e=>{if(e.target===$("#wordDialog"))$("#wordDialog").close()});
$("#dialect").addEventListener("change",()=>{render();if(selectedAnimal&&$("#wordDialog").open)updateDialog(selectedAnimal)});
$("#filter").addEventListener("input",render);
$("#show").addEventListener("change",render);
$("#shuffle").addEventListener("click",()=>{for(let i=animals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[animals[i],animals[j]]=[animals[j],animals[i]]}render()});
render();
</script>
</body></html>
