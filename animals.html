<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animal Flashcards | Cree Learning Studio</title><style>
:root{--ink:#1c403b;--sage:#a5bea8;--muted:#607e76;--bg:#f6f7f3;--line:#d8e5dc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{padding:25px max(20px,calc((100vw - 1020px)/2));background:#fff;border-bottom:1px solid var(--line)}header a{color:var(--muted)}h1{font-family:Georgia,serif;font-size:2.4rem;margin:17px 0 8px}main{max-width:1000px;margin:auto;padding:26px 18px 65px}.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:24px}select,button,input{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;padding:12px 16px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b28c48;outline-offset:2px}.panel{background:#fff;border:1px solid var(--line);border-radius:25px;padding:30px 30px 26px;box-shadow:0 8px 30px #21483c08;max-width:790px;margin:auto}.flashcard{min-height:420px;border:2px solid var(--sage);border-radius:20px;width:100%;background:linear-gradient(130deg,#eff5ed,#fff);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;overflow:hidden}.picture{height:310px;max-width:100%;display:grid;place-items:center}.picture img{max-height:100%;max-width:min(100%,360px);object-fit:contain;border-radius:14px}.name{font-size:clamp(1.6rem,5vw,2.5rem);font-family:Georgia,serif;font-weight:700;text-align:center}.frontlabel{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.backword{font-size:clamp(2rem,6vw,3.5rem);font-family:Georgia,serif;font-weight:700;text-align:center;overflow-wrap:anywhere}.backenglish{margin-top:16px;font-size:1.1rem}nav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;padding-top:25px}.primary{background:var(--ink);color:#fff}.count{min-width:65px;text-align:center}.source{font-size:.78rem;color:var(--muted);text-align:center;margin-top:15px}.source imal-art/horse.svg"},{"name":"Sheep","y":"","yurl":"","th":"","l":"mânišcâniš","n":"mânišcâniš","syll":"ᒫᓂᔥᒑᓂᔥ","page":57,"image":"animal-art/sheep.svg"},{"name":"Fisher","y":"","yurl":"","th":"","l":"ocêk","n":"ocêk","syll":"ᐅᒉᒃ","page":53,"image":"animal-art/fisher.svg"}];
</script><script>
const records=window.CREE_ANIMAL_RECORDS||[];const $=id=>document.getElementById(id);let deck=[],i=0,revealed=false;const done=new Set;const dialects={y:'Plains Cree (Y)',th:'Woodland Cree (TH)',l:'Moose Cree (L)',n:'Swampy Cree (N)'};
function load(){let d=$('dialect').value,q=$('search').value.trim().toLowerCase();deck=records.filter(r=>r[d]&&r.name.toLowerCase().includes(q));i=0;revealed=false;render()}
function render(){let r=deck[i],box=$('content');box.replaceChildren();$('counter').textContent=deck.length?`${i+1} / ${deck.length}`:'0 / 0';$('card').disabled=!r;
if(!r){let el=document.createElement('div');el.className='name';el.textContent='No sourced animal words available in this dialect yet';box.append(el);$('citation').textContent='';return;}
if(!revealed){let pic=document.createElement('div');pic.className='picture';let img=document.createElement('img');img.src=r.image;img.alt=r.name;pic.append(img);let nm=document.createElement('div');nm.className='name';nm.textContent=r.name;box.append(pic,nm)}else{let d=document.createElement('div');d.className='frontlabel';d.textContent=dialects[$('dialect').value];let w=document.createElement('div');w.className='backword';w.textContent=r[$('dialect').value];let en=document.createElement('div');en.className='backenglish';en.textContent=r.name;box.append(d,w,en)}
$('practice').textContent=done.has($('dialect').value+':'+r.name)?'Practised ✓':'Mark practised ✓';let d=$('dialect').value,src=$('citation');src.replaceChildren();if(d==='y'&&r.yurl){let link=document.createElement('a');link.href=r.yurl;link.target='_blank';link.rel='noopener noreferrer';link.textContent='ALTLab itwêwina ↗';src.append(link)}else if((d==='l'||d==='n')&&r.page){src.textContent='Junker & Martinuzzi (eds.), Swampy & Moose Cree Flora & Fauna Glossary (2017), glossary p. '+r.page+(d==='n'?' · Swampy form follows glossary dialect convention':'')}}
$('card').onclick=()=>{revealed=!revealed;render()};$('next').onclick=()=>{if(deck.length){i=(i+1)%deck.length;revealed=false;render()}};$('prev').onclick=()=>{if(deck.length){i=(i+deck.length-1)%deck.length;revealed=false;render()}};$('dialect').onchange=load;$('search').oninput=load;$('shuffle').onclick=()=>{for(let j=deck.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[deck[j],deck[k]]=[deck[k],deck[j]]}i=0;revealed=false;render()};$('practice').onclick=()=>{if(deck.length){done.add($('dialect').value+':'+deck[i].name);render()}};load();
</script></body></html>
